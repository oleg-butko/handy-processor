# Synthetic experiment; parameters fixed before evaluation, not calibrated.
dictionary = "../artifacts/opencorpora-wordfreq/dictionary.rpt"
domain = "../data/fixtures/baseline/domain.txt"
ignore = "../data/fixtures/baseline/ignore.txt"
strict_yo = false

[policy]
max_distance = 1
min_word_length = 5
max_word_length = 64
max_candidates = 20
max_search_nodes = 100000
protect_titlecase = true
protect_uppercase = true

[frequency]
path = "../artifacts/opencorpora-wordfreq/frequency.tsv"

[frequency.scoring]
weight = 1.0
log_cap = 6.0
edit_penalty = 1.0
keep_bias = 1.0
min_keep_margin = 0.5
min_runner_up_margin = 0.5
