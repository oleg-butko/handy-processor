[package]
name = "handy-processor-launcher"
version = "0.1.0"
description = "Optional desktop shell for Handy Processor"
authors = ["Handy Processor contributors"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
